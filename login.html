<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — Pastel Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('img/background.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes popFade {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }

        .login-container {
            width: 380px;
            padding: 45px 40px 50px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 12px 32px rgba(255, 126, 206, 0.35);
            text-align: center;
            animation: popFade 0.7s ease-out;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 10px rgba(255, 160, 220, 0.5);
            user-select: none;
        }

        h2 {
            margin: 0 0 25px;
            font-size: 26px;
            font-weight: 600;
            color: #444;
        }

        .input-box {
            width: 100%;
            position: relative;
            margin: 15px 0;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1.7px solid #cccccc;
            background: rgba(255, 255, 255, 0.88);
            padding-left: 48px;
            padding-right: 45px;
            font-size: 15px;
            outline: none;
            transition: 0.25s;
            box-sizing: border-box;
        }

        .input-box input:focus {
            border-color: #ff93df;
            box-shadow: 0 0 10px rgba(255, 147, 223, 0.55);
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
            color: #ff80cf;
        }

        .toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            cursor: pointer;
            color: #ff80cf;
            user-select: none;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 22px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #ff9bdf, #ff6ec7);
            transition: 0.35s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(255, 110, 199, 0.45);
        }

        .login-container:hover {
            box-shadow: 0 0 18px rgba(255, 180, 240, 0.55);
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo"></div>

        <h2>Welcome ✨</h2>

        <form id="loginForm">

            <div class="input-box">
                <i>👤</i>
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i>🔒</i>
                <input type="password" id="password" placeholder="Password" required>
                <span class="toggle-btn" onclick="togglePassword()">👁</span>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const toggle = document.querySelector(".toggle-btn");

            if (input.type === "password") {
                input.type = "text";
                toggle.textContent = "🙈";
            } else {
                input.type = "password";
                toggle.textContent = "👁";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function(e){
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if(username === "lilie" && password === "lili"){
                localStorage.setItem("loggedIn", "true");
                window.location.href = "index.html"; 
            } else {
                alert("Username atau password salah!");
            }
        });
    </script>

</body>
</html>
