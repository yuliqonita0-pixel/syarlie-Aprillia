<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Planner — Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Zen+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#6c65d6;
  --accent-soft:rgba(108,101,214,.18);
  --muted:#6f6b88;
  --card-bg:rgba(255,255,255,0.28);
  --glass-border:rgba(255,255,255,0.4);
  --shadow-soft:0 25px 60px rgba(40,20,90,0.35);
  --radius-lg:24px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Zen Serif", serif;
  background:url("img/background.png") no-repeat center center fixed;
  background-size:cover;
  color:var(--muted);
  padding-bottom:120px;
}

.app{
  max-width:1150px;
  margin:26px auto;
  padding:0 18px;
}

.card{
  background:var(--card-bg);
  border-radius:var(--radius-lg);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft);
  backdrop-filter: blur(18px);
}

.page-title{
  font-size:1.8rem;
  font-weight:600;
  color:var(--accent);
  margin-bottom:14px;
}

.main-grid{
  display:grid;
  grid-template-columns:1.8fr 1.2fr;
  gap:20px;
}
@media(max-width:900px){
  .main-grid{grid-template-columns:1fr}
}

.calendar-card{padding:18px}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:10px;
  flex-wrap:wrap;
}

.month-label{
  font-size:1.25rem;
  font-weight:600;
  color:var(--accent);
}

.nav-group{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav-btn{
  padding:7px 11px;
  border-radius:12px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.55);
  cursor:pointer;
  font-size:.8rem;
}
.nav-btn:hover{
  background:var(--accent-soft);
  color:var(--accent);
}

.calendar-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 8px;
  text-align:center;
}

.calendar-table th{
  font-size:.75rem;
  color:var(--accent);
}

.calendar-table td{
  cursor:pointer;
  position:relative;
}

.day-inner{
  width:40px;
  height:40px;
  margin:auto;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s;
}

td:hover .day-inner{
  background:rgba(108,101,214,0.08);
}

td.today .day-inner{
  background:rgba(108,101,214,0.18);
  color:var(--accent);
  font-weight:600;
}

td.selected .day-inner{
  background:linear-gradient(135deg,#6c65d6,#a78bfa);
  color:#fff;
}

.event-dot{
  width:6px;
  height:6px;
  background:#ff7ab6;
  border-radius:50%;
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
}

.event-card{padding:18px}

.event-title{
  font-weight:600;
  color:var(--accent);
}

.event-date{
  font-size:.8rem;
  margin-top:4px;
}

.event-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.event-item{
  padding:10px 12px;
  border-radius:14px;
  background:rgba(255,255,255,0.6);
  display:flex;
  justify-content:space-between;
  font-size:.85rem;
}

.event-item button{
  border:none;
  background:none;
  cursor:pointer;
  color:#ef4444;
}

.add-btn{
  margin-top:12px;
  width:100%;
  padding:11px;
  border-radius:999px;
  border:none;
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  color:white;
  cursor:pointer;
}

nav.footer{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--card-bg);
  border-radius:18px;
  padding:8px 16px;
  display:flex;
  gap:14px;
}

.tab{
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  color:var(--muted);
}
.tab.active{
  background:rgba(108,101,214,0.22);
  color:var(--accent);
}
</style>
</head>

<body>

<div class="app">
  <div class="page-title">Kalender</div>

  <section class="main-grid">

    <article class="card calendar-card">
      <div class="calendar-header">
        <div class="month-label" id="monthLabel"></div>
        <div class="nav-group">
          <button class="nav-btn" id="prevYear">« Tahun</button>
          <button class="nav-btn" id="prevMonth">←</button>
          <button class="nav-btn" id="todayBtn">Hari ini</button>
          <button class="nav-btn" id="nextMonth">→</button>
          <button class="nav-btn" id="nextYear">Tahun »</button>
        </div>
      </div>

      <table class="calendar-table">
        <thead>
          <tr>
            <th>Min</th><th>Sen</th><th>Sel</th><th>Rab</th>
            <th>Kam</th><th>Jum</th><th>Sab</th>
          </tr>
        </thead>
        <tbody id="calendarBody"></tbody>
      </table>
    </article>

    <aside class="card event-card">
      <div class="event-title">Agenda harian</div>
      <div class="event-date" id="eventDate">Pilih tanggal</div>
      <div class="event-list" id="eventList"></div>
      <button class="add-btn" id="addEvent">+ Tambah agenda</button>
    </aside>

  </section>
</div>

<nav class="footer">
 <a class="tab" href="index.html">Home</a>
  <a class="tab active" href="calendar.html">Calendar</a>
  <a class="tab" href="profile.html">Profile</a>
  <a class="tab" href="About.html">About us</a>
</nav>

<script>
const monthNames=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const today=new Date();
let m=today.getMonth(),y=today.getFullYear();
let selectedDate=null;
const KEY="planner_events";

const load=()=>JSON.parse(localStorage.getItem(KEY)||"{}");
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));

function render(){
  monthLabel.textContent=monthNames[m]+" "+y;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const data=load();
  let html="",d=1;

  for(let i=0;i<6;i++){
    html+="<tr>";
    for(let j=0;j<7;j++){
      if(i===0&&j<first||d>days){
        html+="<td></td>";
      }else{
        const key=`${y}-${m+1}-${d}`;
        const isToday=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
        const isSel=key===selectedDate;
        html+=`<td class="${isToday?'today':''} ${isSel?'selected':''}" data-date="${key}">
          <div class="day-inner">${d}</div>
          ${data[key]?.length?'<div class="event-dot"></div>':''}
        </td>`;
        d++;
      }
    }
    html+="</tr>";
  }
  calendarBody.innerHTML=html;

  document.querySelectorAll("td[data-date]").forEach(td=>{
    td.onclick=()=>{
      selectedDate=td.dataset.date;
      showAgenda();
      render();
    }
  });
}

function showAgenda(){
  eventList.innerHTML="";
  if(!selectedDate){
    eventDate.textContent="Pilih tanggal";
    return;
  }
  eventDate.textContent=selectedDate;
  const data=load()[selectedDate]||[];
  if(!data.length){
    eventList.innerHTML="<div class='event-item'>Belum ada agenda</div>";
  }
  data.forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="event-item";
    div.innerHTML=`${t}<button>✕</button>`;
    div.querySelector("button").onclick=()=>{
      const all=load();
      all[selectedDate].splice(i,1);
      if(!all[selectedDate].length) delete all[selectedDate];
      save(all);
      showAgenda();render();
    };
    eventList.appendChild(div);
  });
}

addEvent.onclick=()=>{
  if(!selectedDate){alert("Pilih tanggal dulu");return;}
  const t=prompt("Isi agenda:");
  if(!t) return;
  const all=load();
  if(!all[selectedDate]) all[selectedDate]=[];
  all[selectedDate].push(t);
  save(all);
  showAgenda();render();
};

prevMonth.onclick=()=>{m--;if(m<0){m=11;y--;}render();}
nextMonth.onclick=()=>{m++;if(m>11){m=0;y++;}render();}
prevYear.onclick=()=>{y--;render();}
nextYear.onclick=()=>{y++;render();}
todayBtn.onclick=()=>{
  m=today.getMonth();y=today.getFullYear();
  selectedDate=`${y}-${m+1}-${today.getDate()}`;
  render();showAgenda();
};

render();
</script>

</body>
</html>
