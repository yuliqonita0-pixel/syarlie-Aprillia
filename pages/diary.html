<!doctype html> 
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Diary v4.0 — Glassmorphism Dreamy</title>

<link href="https://fonts.googleapis.com/css2?family=Zen+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-1: #fddfee;
  --bg-2: #e3f1ff;
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-bg-hover: rgba(255, 255, 255, 0.6);
  --border-glass: rgba(255,255,255,0.6);
  --text-dark: #333;
  --text-muted: #7a7a84;
  --shadow-soft: 0 20px 44px rgba(0,0,0,0.08);
  --shadow-glow: 0 0 30px rgba(255,150,229,0.4);
  --accent: #ff71bd;
  --radius: 18px;
  --radius-sm: 12px;
}

body {
  margin: 0;
  padding: 22px;
  font-family:"Zen Serif", serif;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  backdrop-filter: blur(6px);
  color: var(--text-muted);
}

.app {
  max-width: 1180px;
  margin: auto;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 26px;
}
@media(max-width:980px) { .app { grid-template-columns: 1fr; } }

.sidebar {
  background: var(--glass-bg);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border-glass);
  box-shadow: var(--shadow-soft);
  backdrop-filter: blur(18px);
}

.brand { 
  display:flex;
  align-items:center;
  gap:12px; 
}
.logo {
  width:58px; height:58px; border-radius:16px;
  background: linear-gradient(135deg,#ff71bd,#ffd6ef);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:20px; font-weight:700;
  box-shadow: var(--shadow-glow);
}
.brand h2 { margin:0; color:var(--accent); }

.btn {
  padding:10px 14px;
  border-radius: var(--radius-sm);
  border:0; cursor:pointer;
  background: linear-gradient(90deg,#ff71bd,#ffa7e0);
  color:#fff; font-weight:600; font-size:13px;
  box-shadow:0 8px 24px rgba(255,113,189,.28);
  transition:.25s ease;
}
.btn:hover { transform: translateY(-3px); }
.btn.ghost {
  background: var(--glass-bg);
  border:1px solid var(--border-glass);
  color:var(--text-muted);
  box-shadow:none;
}


.date-input, .search-input {
  width:100%; padding:10px; border-radius:12px;
  border:1px solid rgba(255,255,255,0.5);
  background: var(--glass-bg); color:var(--text-dark);
}


.list {
  margin-top:12px;
  max-height: 60vh;
  overflow:auto;
}
.entry-card {
  background: var(--glass-bg);
  border-radius: var(--radius-sm);
  padding:14px;
  display:flex; gap:12px; cursor:pointer;
  border:1px solid var(--border-glass);
  margin-bottom:12px;
  transition:.25s;
}
.entry-card:hover {
  background: var(--glass-bg-hover);
  transform: translateY(-6px);
  box-shadow: var(--shadow-soft);
}


.thumb {
  width:58px; height:58px;
  border-radius:14px;
  background:#ffeef9;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  color:#ff53b3;
  overflow:hidden;
}


.editor {
  background: var(--glass-bg);
  padding:26px;
  border-radius: var(--radius);
  border: 1px solid var(--border-glass);
  box-shadow: var(--shadow-soft);
}


.title-input {
  width:100%; font-size:22px; font-weight:700;
  padding:14px; border:1px solid rgba(255,255,255,0.45);
  border-radius:14px; background:var(--glass-bg);
  color:#333;
}


.area {
  width:100%; min-height:260px;
  border-radius:16px; padding:20px;
  border:1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.35);
  resize:vertical; color:#333;
}

.mood-btn {
  padding:8px; border-radius:12px;
  border:1px solid rgba(255,255,255,0.5);
  background:var(--glass-bg); font-size:18px; cursor:pointer;
}

.img-preview {
  max-width:140px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow: var(--shadow-soft);
}

.hidden { display:none; }
.small-muted { font-size:13px; color:var(--text-muted); }
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="logo">MD</div>
    <div>
      <h2>My Diary</h2>
      <div class="small-muted">Dreamy • Glassy • Aesthetic</div>
    </div>
  </div>

  <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
    <button class="btn" id="btnNew">+ Entri Baru</button>
    <button class="btn ghost" id="btnExport">Export</button>
    <button class="btn ghost" id="btnImport">Import</button>
    <button class="btn ghost" id="btnSettings">Settings</button>
  </div>

  <div style="margin-top:18px;">
    <div class="small-muted">Tanggal</div>
    <input type="date" id="datePicker" class="date-input">
  </div>

  <div style="margin-top:18px;">
    <div class="small-muted">Cari Entri</div>
    <input type="text" id="search" class="search-input" placeholder="kata kunci...">
  </div>

  <div style="margin-top:18px;">
    <div class="small-muted">Daftar Entri</div>
    <div class="list" id="entryList"></div>
  </div>
</aside>

<main>
  <div class="editor">
    <div style="display:flex; justify-content:space-between; gap:12px;">
      <input id="title" class="title-input" placeholder="Judul entri...">
      <button class="btn ghost" id="btnLock">🔒</button>
    </div>

    <textarea id="content" class="area" placeholder="Tulis diary kamu..."></textarea>

    <div style="display:flex; align-items:center; gap:10px; margin-top:16px;">
      <div class="small-muted">Mood:</div>
      <button class="mood-btn" data-mood="😊">😊</button>
      <button class="mood-btn" data-mood="🙂">🙂</button>
      <button class="mood-btn" data-mood="😐">😐</button>
      <button class="mood-btn" data-mood="😔">😔</button>
      <button class="mood-btn" data-mood="😢">😢</button>

      <div style="margin-left:auto; display:flex; gap:10px;">
        <input type="file" id="imgInput" accept="image/*" style="display:none;">
        <button class="btn ghost" id="btnImg">🖼 Foto</button>
        <img id="imgPreview" class="img-preview hidden">
        <button class="btn" id="btnSave">Simpan</button>
        <button class="btn ghost" id="btnDelete">Hapus</button>
      </div>
    </div>

    <div class="meta-bar">
      <div class="small-muted" id="metaInfo">Belum disimpan</div>
      <div class="small-muted" id="lastSaved">—</div>
    </div>
  </div>

  <div class="modal-back" id="settingsModal" style="display:none;"></div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
</main>

</div>


<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const nowISO = () => new Date().toISOString();
const dateOnly = d => new Date(d).toISOString().split('T')[0];
const formatDateNice = iso => new Date(iso).toLocaleString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

let diaryEntries = JSON.parse(localStorage.getItem('diaryEntries') || '{}');
let currentId = null;
let currentMood = null;

const entryList = $('#entryList');
const titleInput = $('#title');
const contentInput = $('#content');
const imgInput = $('#imgInput');
const imgPreview = $('#imgPreview');
const lastSaved = $('#lastSaved');
const metaInfo = $('#metaInfo');

function renderList(query=''){
  entryList.innerHTML='';
  const q=query.toLowerCase();
  const arr=Object.values(diaryEntries).sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
  const filtered=arr.filter(x=>!q || x.title?.toLowerCase().includes(q) || x.content?.toLowerCase().includes(q));
  if(filtered.length===0){
    entryList.innerHTML='<div class="small-muted" style="padding:10px">Belum ada entri.</div>';
    return;
  }
  filtered.forEach(it=>{
    const card=document.createElement('div'); card.className='entry-card';
    const thumb=document.createElement('div'); thumb.className='thumb';
    if(it.imageDataURL){ thumb.style.backgroundImage=`url('${it.imageDataURL}')`; thumb.style.backgroundSize='cover'; }
    else thumb.textContent=it.mood||'✍️';
    const meta=document.createElement('div');
    meta.innerHTML=`<div style="color:#333;font-weight:700">${it.title||'(Tanpa Judul)'}</div>
                    <div style="font-size:13px;color:#777">${(it.content||'').slice(0,80)}</div>
                    <div style="font-size:12px;margin-top:6px">${formatDateNice(it.date)}</div>`;
    card.appendChild(thumb); card.appendChild(meta);
    card.onclick=()=>openEntry(it.id);
    entryList.appendChild(card);
  });
}

function openEntry(id){
  currentId=id;
  const it=diaryEntries[id];
  titleInput.value=it.title||'';
  contentInput.value=it.content||'';
  currentMood=it.mood||null;

  if(it.imageDataURL){
    imgPreview.src=it.imageDataURL;
    imgPreview.classList.remove('hidden');
  } else imgPreview.classList.add('hidden');

  lastSaved.textContent=`Terakhir: ${new Date(it.updatedAt).toLocaleString('id-ID')}`;
}


function saveCurrent(){
  if(!currentId){
    const id='id-'+Date.now();
    diaryEntries[id]={id,date:dateOnly(new Date()),createdAt:nowISO(),updatedAt:nowISO()};
    currentId=id;
  }
  const it=diaryEntries[currentId];
  it.title=titleInput.value;
  it.content=contentInput.value;
  it.mood=currentMood;
  it.updatedAt=nowISO();

  localStorage.setItem('diaryEntries',JSON.stringify(diaryEntries));
  renderList($('#search').value);
  lastSaved.textContent=`Terakhir: ${new Date(it.updatedAt).toLocaleString('id-ID')}`;
  metaInfo.textContent='Disimpan ✔';
  setTimeout(()=>metaInfo.textContent='',1200);
}

$('#btnSave').onclick = saveCurrent;


$('#btnNew').onclick=()=>{ currentId=null; titleInput.value=''; contentInput.value=''; imgPreview.classList.add('hidden'); };


$('#btnDelete').onclick=()=>{
  if(!currentId) return;
  if(confirm('Hapus entri ini?')){
    delete diaryEntries[currentId];
    localStorage.setItem('diaryEntries',JSON.stringify(diaryEntries));
    currentId=null; renderList();
    titleInput.value=''; contentInput.value='';
  }
};


$('#btnImg').onclick=()=>imgInput.click();
imgInput.onchange=function(){
  const f=this.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    imgPreview.src=e.target.result;
    imgPreview.classList.remove('hidden');
    if(!currentId){
      const id='id-'+Date.now();
      diaryEntries[id]={id,date:dateOnly(new Date()),createdAt:nowISO(),updatedAt:nowISO()};
      currentId=id;
    }
    diaryEntries[currentId].imageDataURL=e.target.result;
    saveCurrent();
  };
  r.readAsDataURL(f);
};


$$('.mood-btn').forEach(btn=>{
  btn.onclick=()=>{ currentMood=btn.dataset.mood; saveCurrent(); };
});


$('#search').oninput=e=>renderList(e.target.value);


$('#btnExport').onclick=()=>{
  const data={entries:diaryEntries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='diary-export.json';
  a.click();
};


$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=function(){
  const f=this.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const data=JSON.parse(r.result);
    diaryEntries={...diaryEntries,...data.entries};
    localStorage.setItem('diaryEntries',JSON.stringify(diaryEntries));
    renderList();
  };
  r.readAsText(f);
};


renderList();
</script>

</body>
</html>
