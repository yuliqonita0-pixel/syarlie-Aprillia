<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Zen+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#6366f1;
  --income:#22c55e;
  --expense:#ef4444;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
}

body.dark{
  --bg:#0f172a;
  --card:#020617;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Zen Serif", serif;
  background:var(--bg);
  color:var(--text);
  padding:24px;
}

.container{
  max-width:920px;
  margin:auto;
  background:var(--card);
  padding:24px;
  border-radius:22px;
  box-shadow:0 20px 45px rgba(0,0,0,.1);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:28px;
  font-weight:700;
}

.toggle{
  cursor:pointer;
  font-size:22px;
  transition:.2s;
}
.toggle:hover{transform:rotate(20deg)}

form{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:18px;
}

input,select,button{
  padding:12px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  font-family:inherit;
}

button{
  background:var(--primary);
  color:white;
  border:none;
  font-weight:600;
  cursor:pointer;
}

button:hover{opacity:.9}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:18px;
}

.card{
  padding:16px;
  border-radius:18px;
  text-align:center;
  animation:fade .4s ease;
}

.card span{
  display:block;
  margin-top:6px;
  font-size:18px;
  font-weight:700;
}

.income{background:#dcfce7;color:var(--income)}
.expense{background:#fee2e2;color:var(--expense)}
.balance{background:#e0e7ff;color:var(--primary)}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.income{background:#dcfce7;color:var(--income)}
.badge.expense{background:#fee2e2;color:var(--expense)}

.delete{
  background:var(--expense);
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

canvas{
  margin-top:24px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
}

@media(max-width:768px){
  form{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>💸 Finance Tracker</h1>
  <div class="toggle" onclick="toggleTheme()">🌙</div>
</header>

<form id="form">
  <input id="name" placeholder="Nama transaksi" required>
  <input id="amount" type="number" placeholder="Nominal" required>
  <select id="category">
    <option>Makanan</option>
    <option>Transport</option>
    <option>Belanja</option>
    <option>Gaji</option>
  </select>
  <select id="type">
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>
  <button>Tambah</button>
</form>

<div class="summary">
  <div class="card income">Pemasukan<span id="inc">Rp 0</span></div>
  <div class="card expense">Pengeluaran<span id="exp">Rp 0</span></div>
  <div class="card balance">Saldo<span id="bal">Rp 0</span></div>
</div>

<table>
<thead>
<tr>
  <th>Nama</th>
  <th>Kategori</th>
  <th>Nominal</th>
  <th>Jenis</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<div id="empty" class="empty" hidden>
  Belum ada transaksi ✨
</div>

<canvas id="chart"></canvas>

</div>

<script>
const form = document.getElementById("form");
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const incEl = document.getElementById("inc");
const expEl = document.getElementById("exp");
const balEl = document.getElementById("bal");
const chartEl = document.getElementById("chart");

let data = JSON.parse(localStorage.getItem("finance_upgrade")) || [];
let chart;

const rupiah = n => "Rp " + n.toLocaleString("id-ID");

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark"));
}

if(localStorage.getItem("theme")==="true"){
  document.body.classList.add("dark");
}

function render(){
  list.innerHTML="";
  let income=0, expense=0;

  empty.hidden = data.length !== 0;

  data.forEach((d,i)=>{
    list.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.category}</td>
        <td>${rupiah(d.amount)}</td>
        <td><span class="badge ${d.type}">${d.type}</span></td>
        <td><button class="delete" onclick="remove(${i})">Hapus</button></td>
      </tr>
    `;
    d.type==="income" ? income+=d.amount : expense+=d.amount;
  });

  incEl.textContent = rupiah(income);
  expEl.textContent = rupiah(expense);
  balEl.textContent = rupiah(income-expense);

  localStorage.setItem("finance_upgrade", JSON.stringify(data));
  drawChart(income, expense);
}

function drawChart(inc, exp){
  if(chart) chart.destroy();
  chart = new Chart(chartEl,{
    type:"bar",
    data:{
      labels:["Pemasukan","Pengeluaran"],
      datasets:[{
        data:[inc,exp],
        backgroundColor:["#22c55e","#ef4444"],
        borderRadius:10
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      animation:{duration:600}
    }
  });
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  data.push({
    name: name.value,
    amount: +amount.value,
    category: category.value,
    type: type.value
  });
  form.reset();
  render();
});

function remove(i){
  data.splice(i,1);
  render();
}

render();
</script>
</body>
</html>
